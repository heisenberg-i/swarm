# PURPOSE: Local-dev Spring profile (same PostgreSQL, CORS for Vite).
# Dev profile: same PostgreSQL + TimescaleDB as production. Credentials via env.
server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8081}}

biopower:
  cors:
    allowed-origins: >-
      http://localhost:3000,
      http://localhost:5173,
      http://127.0.0.1:3000,
      http://192.168.*:3000,
      http://10.*:3000,
      http://172.16.*:3000

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-min-256-bits-local-secret!!}

mqtt:
  enabled: false

logging:
  level:
    com.biopower: INFO
